<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Roue du Destin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #D4A843;
  --gold-light: #F5D98B;
  --gold-dark: #7A5C1E;
  --crimson: #8B1A1A;
  --crimson-light: #C0392B;
  --ink: #09090f;
  --parchment: #F2E8D0;
  --parchment-dim: #C4B48A;
  --shadow: rgba(0,0,0,0.7);
}

html, body {
  width: 100%; min-height: 100vh;
  overflow-x: hidden;
  background: var(--ink);
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 2rem 1rem 3rem;
  font-family: 'Cinzel', serif;
  color: var(--parchment);
  cursor: default;
  position: relative;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background: 
    radial-gradient(circle at 50% 30%, rgba(139,26,26,0.25) 0%, transparent 60%),
    radial-gradient(circle at 20% 80%, rgba(212,168,67,0.08) 0%, transparent 40%),
    #09090f;
}

#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 2.5rem;
  width: 100%; max-width: 600px;
}

.header { text-align: center; }

.title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(2.2rem, 7vw, 4rem);
  font-weight: 900;
  color: var(--gold-light);
  text-shadow: 0 0 20px rgba(212,168,67,0.4), 0 4px 10px var(--shadow);
  line-height: 1.1;
  letter-spacing: 1px;
}

.subtitle {
  font-family: 'IM Fell English', Georgia, serif;
  font-style: italic;
  font-size: clamp(1.1rem, 3.5vw, 1.4rem);
  color: var(--parchment-dim);
  margin-top: 0.5rem;
  letter-spacing: 1px;
}

.live-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 16px;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--gold-dark);
  border-radius: 4px;
  font-size: 0.75rem;
  letter-spacing: 2px;
  color: var(--parchment-dim);
  box-shadow: 0 4px 10px var(--shadow);
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #2ecc71;
  box-shadow: 0 0 10px #2ecc71;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.wheel-frame {
  position: relative;
  padding: 12px;
  background: radial-gradient(circle, #1a1a26 0%, #0d0d13 100%);
  border: 4px double var(--gold);
  border-radius: 50%;
  box-shadow: 0 20px 50px var(--shadow), inset 0 0 30px rgba(0,0,0,0.8);
}

.wheel-container {
  position: relative;
  width: min(440px, 85vw);
  height: min(440px, 85vw);
  border-radius: 50%;
  overflow: hidden;
}

canvas { display: block; width: 100%; height: 100%; }

.needle {
  position: absolute;
  top: -4px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 32px solid var(--gold-light);
  filter: drop-shadow(0 4px 6px var(--shadow)) drop-shadow(0 0 8px var(--gold));
  z-index: 10;
}

.spin-btn {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(84px, 17vw); height: min(84px, 17vw);
  border-radius: 50%;
  background: radial-gradient(circle, var(--crimson-light) 0%, var(--crimson) 100%);
  border: 3px solid var(--gold);
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(0.7rem, 2vw, 0.9rem);
  font-weight: 700;
  color: var(--parchment);
  text-shadow: 0 2px 4px var(--shadow);
  cursor: pointer; z-index: 20;
  box-shadow: 0 8px 20px var(--shadow), inset 0 2px 4px rgba(255,255,255,0.3);
  transition: all 0.15s ease-out;
}
.spin-btn:hover:not(:disabled) {
  filter: brightness(1.1);
  box-shadow: 0 10px 25px var(--shadow), 0 0 15px rgba(214,168,67,0.4);
}
.spin-btn:active:not(:disabled) {
  transform: translate(-50%, -50%) scale(0.95);
  box-shadow: 0 4px 10px var(--shadow);
}
.spin-btn:disabled { filter: grayscale(0.6) brightness(0.7); cursor: not-allowed; }

.result-box {
  width: 100%; max-width: 460px;
  background: rgba(13,13,19,0.85);
  border: 1px solid var(--gold-dark);
  border-radius: 8px;
  padding: 1.25rem;
  text-align: center;
  box-shadow: 0 15px 35px var(--shadow);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.result-title {
  font-size: 0.75rem;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}
.result-text {
  font-family: 'IM Fell English', serif;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  color: var(--parchment);
  min-height: 3rem;
  display: flex; align-items: center; justify-content: center;
}
.result-text.pop { animation: popEffect 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes popEffect { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }

.spin-counter {
  font-size: 0.7rem;
  letter-spacing: 2px;
  color: var(--parchment-dim);
  text-transform: uppercase;
  opacity: 0.7;
}

#flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: #fff; opacity: 0; transition: opacity 0.1s ease-out;
}
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.c { position: absolute; top: -20px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="flash"></div>
<div id="confetti"></div>

<div class="content">
  <header class="header">
    <h1 class="title">La Roue<br>du Destin</h1>
    <p class="subtitle">Le sort en est jeté</p>
  </header>

  <div class="live-badge">
    <span class="live-dot"></span>
    <span id="statusText">Connexion...</span>
  </div>

  <div class="wheel-frame">
    <div class="wheel-container">
      <canvas id="canvas" width="440" height="440"></canvas>
      <div class="needle"></div>
      <button class="spin-btn" id="spinBtn" onclick="localSpin()">LANCER</button>
    </div>
  </div>

  <div class="result-box">
    <div class="result-title">Le verdict du destin</div>
    <div class="result-text" id="result">—</div>
  </div>

  <div class="spin-counter" id="counter">Aucun tirage</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let segments = ['🍋 Citron','💎 Diamant','🔥 Jackpot','💀 Zéro','⭐ Bonus','🎁 Cadeau','🃏 Joker','🪙 Or'];
let angle = 0;
let spinning = false;
let totalSpins = 0;

const COLORS = ['#8B1A1A', '#1C1C24', '#A62424', '#252530', '#731212', '#181822', '#540B0B', '#2C2C3A'];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const SZ = 440;
const cx = SZ/2, cy = SZ/2, R = SZ/2 - 5;

function draw(a) {
  ctx.clearRect(0, 0, SZ, SZ);
  const n = segments.length;
  if(!n) return;
  const arc = (Math.PI * 2) / n;

  for (let i = 0; i < n; i++) {
    const start = a + i * arc;
    const end = start + arc;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, start, end);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();

    ctx.strokeStyle = '#D4A843';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#F2E8D0';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    const fs = Math.max(11, Math.min(16, SZ / (n * 1.3)));
    ctx.font = `bold ${fs}px 'Cinzel', serif`;
    ctx.fillText(segments[i], R - 25, fs * 0.35);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = '#D4A843';
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R - 4, 0, Math.PI*2);
  ctx.strokeStyle = '#7A5C1E';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  const centerR = SZ * 0.12;
  ctx.beginPath();
  ctx.arc(cx, cy, centerR, 0, Math.PI*2);
  ctx.fillStyle = '#09090f';
  ctx.fill();
  ctx.strokeStyle = '#D4A843';
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

function spinToSegment(winIndex, onDone) {
  const n = segments.length;
  const arc = (Math.PI * 2) / n;
  
  const targetAngle = -(winIndex * arc + arc / 2) - Math.PI/2;
  const currentMod = ((angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const targetMod  = ((targetAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  let delta = targetMod - currentMod;
  if (delta < 0) delta += Math.PI * 2;
  const totalRot = Math.PI * 2 * 7 + delta;

  const duration = 5800;
  const arcSize = (Math.PI*2)/n;
  let lastTickAngle = angle;
  const startAngle = angle;

  const startTime = performance.now();
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(now) {
    const p = Math.min((now - startTime) / duration, 1);
    const eased = easeOut(p);
    angle = startAngle + totalRot * eased;

    if (angle - lastTickAngle >= arcSize) {
      lastTickAngle += arcSize;
      const speed = totalRot * 2.5 * Math.pow(1 - p, 3);
      if (speed > 0.15) playTick(speed);
    }

    if (p > 0.88) {
      const shake = (1 - p) * 3;
      document.querySelector('.needle').style.transform = `translateX(-50%) translateY(${(Math.random() - 0.5) * shake}px)`;
    }

    draw(angle);
    if (p < 1) {
      requestAnimationFrame(frame);
    } else {
      document.querySelector('.needle').style.transform = 'translateX(-50%)';
      onDone();
    }
  }
  requestAnimationFrame(frame);
}

function localSpin() {
  if (spinning || segments.length < 2) return;
  
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('result').textContent = '—';
  document.getElementById('result').classList.remove('pop');
  
  // Envoie la requête sécurisée au serveur au lieu de calculer localement
  socket.emit('request-spin');
}

const socket = io();
socket.on('connect', () => { document.getElementById('statusText').textContent = 'En direct'; });
socket.on('disconnect', () => { document.getElementById('statusText').textContent = 'Déconnecté'; });
socket.on('wheel-update', data => { segments = data.segments; draw(angle); });

socket.on('spin-start', data => {
  if (spinning) return;
  spinning = true;
  segments = data.segments;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('result').textContent = 'Le destin tourne...';
  document.getElementById('result').classList.remove('pop');
  playLaunch();
  
  spinToSegment(data.winIndex, () => {
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
  });
});

socket.on('spin-result', data => { 
  setTimeout(() => showResult(data.result), 200); 
});

function showResult(text) {
  const r = document.getElementById('result');
  r.textContent = text;
  void r.offsetWidth;
  r.classList.add('pop');
  
  totalSpins++;
  document.getElementById('counter').textContent = `Tirages effectués : ${totalSpins}`;
  
  document.getElementById('flash').style.opacity = '0.3';
  setTimeout(() => { document.getElementById('flash').style.opacity = '0'; }, 80);
  
  playWin();
  launchConfetti();
}

function launchConfetti() {
  const c = document.getElementById('confetti');
  const colors = ['#D4A843', '#F5D98B', '#8B1A1A', '#F2E8D0', '#C0392B'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'c';
    const size = 4 + Math.random()*6;
    el.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${Math.random()>0.5?'50%':'0'};animation:fall ${2+Math.random()*1.5}s ${Math.random()*0.1}s linear forwards;`;
    c.appendChild(el);
  }
  setTimeout(() => c.innerHTML = '', 3600);
}

let AC;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function playTick(speed) {
  try {
    const a = getAC(), t = a.currentTime;
    const vol = Math.min(0.2, 0.02 + speed*0.003);
    const osc = a.createOscillator(), g = a.createGain();
    osc.connect(g); g.connect(a.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(700 + speed * 6, t);
    osc.frequency.exponentialRampToValueAtTime(200, t + 0.015);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    osc.start(t); osc.stop(t + 0.022);
  } catch(e) {}
}
function playLaunch() {
  try {
    const a = getAC(), t = a.currentTime;
    const osc = a.createOscillator(), g = a.createGain();
    osc.connect(g); g.connect(a.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(100, t);
    osc.frequency.exponentialRampToValueAtTime(350, t + 0.25);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    osc.start(t); osc.stop(t + 0.29);
  } catch(e) {}
}
function playWin() {
  try {
    const a = getAC();
    [440, 554, 659, 880].forEach((f,i) => {
      const t = a.currentTime + i*0.08;
      const osc = a.createOscillator(), g = a.createGain();
      osc.connect(g); g.connect(a.destination);
      osc.frequency.value = f; osc.type = 'sine';
      g.gain.setValueAtTime(0.2, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.31);
    });
  } catch(e) {}
}

(function() {
  const c = document.getElementById('stars');
  const bx = c.getContext('2d');
  let W, H, stars;
  function init() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
    stars = Array.from({length:100}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.2 + 0.2,
      a: Math.random(), spd: .001 + Math.random()*.003,
      gold: Math.random() > 0.75
    }));
  }
  init();
  window.addEventListener('resize', init);
  (function loop() {
    bx.clearRect(0,0,W,H);
    stars.forEach(s => {
      s.a += s.spd; if(s.a>1) s.a=0;
      const alpha = Math.sin(s.a*Math.PI) * 0.6;
      bx.beginPath(); bx.arc(s.x,s.y,s.r,0,Math.PI*2);
      bx.fillStyle = s.gold ? `rgba(214,168,67,${alpha})` : `rgba(242,232,208,${alpha})`;
      bx.fill();
    });
    requestAnimationFrame(loop);
  })();
})();

draw(angle);
</script>
</body>
</html>
